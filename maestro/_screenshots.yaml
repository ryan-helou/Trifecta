# App Store screenshots (not a gate — `_` prefixed so verify-ios.sh skips it; depends on
# the seeded `trifectademo` account). Driven by scripts/screenshots-ios.sh, which boots a
# 6.9" Pro Max, pins the status bar to 9:41, and files the output into
# fastlane/screenshots/en-US/. Seed with: npx tsx scripts/seed-demo.ts
#
# What changed and why: the old flow captured four tab-level screens and tapped the tabs
# by TEXT. Two problems. Tab labels also occur in page copy ("Plan" appears in Today's
# week card), so a tap can land on body content instead of the tab. And four tab shots
# sell the app short — the two most distinctive things Trifecta does, the session
# breakdown and the guided player, were never shown at all. Apple allows ten.
#
# Ordered as the store displays them, strongest first:
#   1 Today          the race countdown — the emotional hook
#   2 Session        interval shape, why-it-matters, per-step targets in real paces
#   3 Guided player  the big live timer; nothing else in the category looks like it
#   4 Plan           the periodised arc
#   5 Progress       Fitness · Fatigue · Form — the moat, made visible
#   6 Apple Health   Profile → Apple Health. Doubles as evidence for guideline 2.5.1,
#                    the citation that rejected build 8.
#
# Tabs are tapped by POINT (five equal columns pinned to the bottom), same as _tour.yaml.
# Login fills PASSWORD FIRST then username and submits with Enter — see _tour.yaml for
# the WKWebView focus trap that makes any other order silently concatenate the fields.
#
# The "logged in" gate is the word LEAGUE, not "Friends". The league merge renamed that
# tab; "Friends" now survives only as an eyebrow INSIDE the League tab, so it is absent
# from Today and the old assertion could never pass. NOTE: _tour.yaml, _deep-tour.yaml
# and _strava-review.yaml still gate on "Friends" and have the same problem.
appId: app.trifecta.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
# iOS can put its own "Enable Dictation?" alert over the app the first time a text
# field takes focus, and it survives an app relaunch — one earlier run left it up and
# the next run failed on the welcome screen with the app rendering perfectly behind it.
# Dismiss it if it's there before asserting on anything of ours.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 3000
# 120s, not 60s. On a freshly created simulator the first launch after an install has to
# cold-start the WKWebView AND fetch the app shell over the network; it has overshot 60s
# twice, failing a run on an app that was rendering perfectly a moment later.
- extendedWaitUntil:
    visible: "Create your plan"
    timeout: 120000
- extendedWaitUntil:
    visible: ".*Sign in.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 3
    commands:
      - tapOn: ".*Sign in.*"
      - extendedWaitUntil:
          visible: "Username"
          timeout: 20000
- retry:
    maxRetries: 3
    commands:
      - tapOn: "••••••••"
      - eraseText
      - inputText: "demopass123"
      - tapOn: "ironmike"
      - eraseText
      - inputText: "trifectademo"
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "League"
          timeout: 60000
- waitForAnimationToEnd:
    timeout: 6000

# 1 — Today: race countdown, projected finish, the three legs
- takeScreenshot: store-1-today

# 2 — the session itself: interval shape, why it matters, per-step targets
#
# ${SHOT_SESSION} is the next UPCOMING session, injected by scripts/screenshots-ios.sh.
# It is deliberately not today's: late in the day the Today screen grows a "QUICK CHECK —
# Nailed today's <session>?" card that repeats the title above the list, and Maestro
# matches case-insensitively, so a title regex lands on that card instead of the row.
# Today's row also has a mark-done toggle carrying the same title. An upcoming session has
# neither, so a plain title tap is unambiguous.
- scrollUntilVisible:
    element: ".*${SHOT_SESSION}.*"
    direction: DOWN
    centerElement: true
    timeout: 25000
- tapOn: ".*${SHOT_SESSION}.*"
- waitForAnimationToEnd:
    timeout: 6000
# Expand "Session structure". It is COLLAPSED by default (a deliberate product choice —
# see WorkoutDetail.tsx), which means the sheet opens on a stack of action buttons. That
# makes a poor screenshot: this frame is captioned "Not just what to do. Why." and the
# per-interval targets are the whole point of it. One tap turns the shot back into the
# session breakdown.
#
# Wrapped in .* because Maestro matches the WHOLE accessibility label as a regex, and the
# label for this control is "Session structure Show ▾" — the disclosure state is part of
# the same node, so the bare string never matches.
- tapOn: ".*Session structure.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: store-2-session

# 3 — guided player, a beat after it starts so the timer reads as live
- scrollUntilVisible:
    element: ".*Start guided session.*"
    direction: DOWN
    centerElement: true
    timeout: 25000
- tapOn: ".*Start guided session.*"
- waitForAnimationToEnd:
    timeout: 6000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: store-3-guided
# Back to a clean Today before touching the tab bar.
#
# Closing the player does NOT return to Today — it returns to the session sheet that is
# still open underneath, and the tab-bar points then land on that sheet's buttons. That
# is exactly what happened on the first run: taps meant for Plan/Progress/Profile hit
# "Ask the coach about this", and three store screenshots came out as the Coach sheet
# with an iOS dictation prompt over it.
#
# Relaunching is deterministic where unwinding nested sheets is not, and it is safe now
# that a cold boot restores the session (see relaunch.yaml).
- launchApp
- extendedWaitUntil:
    visible: "League"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 6000

# 4 — Plan
- tapOn:
    point: "30%,94%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-4-plan

# 5 — Progress (Fitness · Fatigue · Form)
- tapOn:
    point: "50%,94%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-5-progress

# 6 — Profile → Apple Health. It sits above "Training paces" now, so the top of the tab
#     already contains it; no scrolling needed on a 6.9" screen.
- tapOn:
    point: "90%,94%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-6-apple-health
