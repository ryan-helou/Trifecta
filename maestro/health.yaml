# Trifecta iOS — "is the Apple Health feature findable?" (Maestro).
#
# This flow exists because App Review rejected build 8 under **guideline 2.5.1**:
# the app ships the HealthKit entitlement but "does not clearly identify the
# HealthKit ... functionality in the app's user interface."
#
# They were right. The Apple Health card was rendered *inside* the Strava component,
# which opened with `if (!status) return null` — `status` being the Strava API's
# response. So the only HealthKit UI in the app could silently not exist whenever an
# unrelated network call hadn't come back, it sat under a heading that said "Device
# sync", and it lived at the bottom of the fifth tab.
#
# The regression this guards is therefore not "does sync work" (that needs real
# workouts on a real device) but "can a person who opens the app FIND the Apple
# Health feature at all". Signs in as the same demo account we hand Apple, opens the
# same tab a reviewer would, and asserts the section identifies itself by name.
#
# Demo account (the one in App Store Connect → App Review Information):
#   trifectademo / demopass123 — has a fully populated 70.3 plan.
appId: app.trifecta.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny            # HealthKit must be *identified* without being authorized
- extendedWaitUntil:
    visible: "Create your plan"
    timeout: 40000
- extendedWaitUntil:
    visible: ".*Sign in.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 3
    commands:
      - tapOn: ".*Sign in.*"
      - extendedWaitUntil:
          visible: "Username"
          timeout: 15000
- tapOn: "ironmike"
- inputText: "trifectademo"
- tapOn: "Password"                          # inert label: blurs input → keyboard down
- assertVisible: "trifectademo"
- tapOn: "••••••••"
- inputText: "demopass123"
- tapOn: "Password"
- tapOn: "Sign in"
# The demo account already has a plan, so login lands on the app shell, not onboarding.
- extendedWaitUntil:
    visible: "Profile"
    timeout: 40000          # login round-trip (incl. possible Railway cold start) + render
- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 5000
# The whole point: the section names itself "Apple Health", and it is reachable
# without connecting Strava, without granting HealthKit access, and without the
# Strava status call having resolved.
- extendedWaitUntil:
    visible: "Apple Health"
    timeout: 15000
- takeScreenshot: 10-profile-apple-health
- assertVisible: "Auto-complete from Apple Health"
- assertVisible: ".*never writes to Apple Health.*"
- assertVisible: ".*Sync with Apple Health.*"
- takeScreenshot: 11-apple-health-card
# --- the 2.1(a) regression -------------------------------------------------
# Build 12 was rejected under guideline 2.1(a): "Sync with Apple Health button was
# unresponsive." Everything above this line PASSED on that exact build, because
# assertVisible proves the button EXISTS, not that it WORKS — and it existed. It was
# `disabled`: `state` starts "checking" and only leaves it when healthAvailable()
# resolves, which awaited a dynamic import() of the Capacitor plugin. That import
# HANGS FOREVER in the bundled WKWebView (the same trap documented in lib/notify.ts
# and lib/tokenStore.ts), so setState never fired and the button never enabled.
#
# So: TAP it, and prove the app actually responds. Permissions are denied above, so
# the read comes back empty and the app must say so — reaching that toast means the
# whole path ran: probe resolved -> button enabled -> tap handled -> plugin called ->
# result rendered. If the plugin import ever hangs again, this fails instead of Apple.
#
# Timing: HealthKit genuinely cannot work on this simulator — the gate builds unsigned
# (CODE_SIGNING_ALLOWED=NO), so the app carries no HealthKit entitlement, no permission
# sheet is presented and the plugin's completion never fires. That is a simulator
# artifact, not the device behaviour. What this flow therefore proves is the property
# Apple actually rejected us on: the button RESPONDS, and the UI always resolves to a
# message instead of a spinner that never ends. It reaches the toast via the timeouts in
# lib/health.ts (20s auth + 20s read), so allow comfortably more than 40s.
- tapOn: "Sync with Apple Health"
- extendedWaitUntil:
    visible: ".*no new workouts to match.*"
    timeout: 70000
- takeScreenshot: 12-apple-health-tapped
