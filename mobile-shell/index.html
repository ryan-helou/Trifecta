<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trifecta</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0b1220; color: #e6ebf5;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding: 2rem env(safe-area-inset-right) 2rem env(safe-area-inset-left);
        gap: 0.75rem;
      }
      h1 { font-size: 1.5rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0; opacity: 0.7; max-width: 26ch; line-height: 1.5; }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: #ff8a3d; margin-bottom: 0.5rem; }
      button {
        margin-top: 0.75rem; border: 0; border-radius: 999px; padding: 0.7rem 1.4rem;
        font-size: 1rem; font-weight: 600; color: #0b1220; background: #ff8a3d;
      }
    </style>
  </head>
  <body>
    <!--
      Offline fallback. In Path A the app loads the live site over the network; this
      screen appears only when that fails (e.g. airplane mode). A real, designed
      offline screen also helps clear Apple's Guideline 4.2 airplane-mode check.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <h1>You're offline</h1>
      <p>Trifecta needs a connection to load your training plan. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
